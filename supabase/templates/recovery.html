<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><title>Reset your TalkingStage password</title></head>
<body style="margin:0;padding:24px 16px;background:#FAF8FA;color:#241C23;font-family:Arial,sans-serif;line-height:1.6">
<div style="max-width:480px;margin:0 auto;background:#FFFFFF;padding:24px;border-radius:16px;border:1px solid #E8DFE6">
<p style="color:#682447;font-weight:bold;font-size:20px;margin:0 0 32px">TalkingStage</p>
<h1 style="font-family:Georgia,serif;font-size:30px;line-height:1.2;margin:0 0 16px">Let’s get you back in.</h1>
<p>Use this link to choose a new password for your TalkingStage account.</p>
<p style="margin:28px 0"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#682447;color:#FFFFFF;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:bold">Reset password</a></p>
<p style="color:#716570;font-size:14px">If you didn’t request a password reset, you can ignore this email. Your password will stay the same.</p>
</div></body></html>
